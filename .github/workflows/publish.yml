# Publishes to npm with trusted publishing (OIDC). No npm token is stored anywhere.
# Release: bump "version" in package.json, commit, then push a tag named v<version>.
# Run it by hand from the Actions tab to rehearse without publishing.
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        if: github.event_name == 'push'
        run: |
          want="v$(node -p "require('./package.json').version")"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match package.json ($want)"; exit 1; }
      - name: Syntax check
        run: git ls-files '*.js' | xargs -n1 node --check
      - name: Show what will be published
        run: npm --version && npm pack --dry-run
      - name: Publish
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            npm publish
          elif npm view "$(node -p "const p=require('./package.json');p.name+'@'+p.version")" version >/dev/null 2>&1; then
            echo "::notice::Rehearsal only. This version is already on npm, so bump package.json before tagging."
          else
            npm publish --dry-run
          fi
